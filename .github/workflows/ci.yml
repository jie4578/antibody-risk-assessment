name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      # 无真实 key 时 DeepSeekLLM 构造需要非空 key(测试内 mock 客户端,不联网)
      DEEPSEEK_API_KEY: sk-ci-dummy
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0
      - name: Install core + Desktop + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[desktop,dev]"
      - name: Run tests
        run: python -m pytest -q

  test-optional:
    name: "pytest (optional deps: torch + langchain)"
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: sk-ci-dummy
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt Linux runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0
      - name: Install CPU torch (小体积) + all extras
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install ".[all,dev]"
      - name: Run tests (含可选模块)
        run: python -m pytest -q

  desktop-integrity:
    name: Desktop, wheel and offline validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      DEEPSEEK_API_KEY: sk-ci-dummy
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0
      - name: Install Desktop and test dependencies
        run: python -m pip install ".[desktop,dev]"
      - name: Application and installed-wheel smoke tests
        run: python -m pytest -q
      - name: Offline validation integrity (no private data bundle required)
        run: >-
          python -m pytest -q
          validation/tests/test_audit_compatibility.py
          validation/tests/test_runtime_embedding_parity.py
          validation/tests/test_phase8_documentation.py
          validation/external_developability/tests/test_phase8c_hic_external_evaluation.py
